<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather News</title>
    <link rel="stylesheet" href="./styles/app.css">
    <script src="./scripts/script.js" defer></script>
</head>
<body>
    <div class="inputContainer">
        <input type="text" id="search" placeholder="Enter a city name">
        <button id="searchButton">Search</button>
    </div>
    <div class="weatherContainer">
        <h1>name of city: <span class="city"></span></h1>
        <p>temperature: <span class="temperature"></span></p>
        <p>description: <span class="description"></span></p>
        <p>humidity: <span class="humidity"></span></p>
        <p>wind: <span class="wind"></span></p>
    </div>
    
</body>
</html>
