<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>session 11 tables practice</title>
</head>
<body>
    <h1>Contact List</h1>
    <table>
        <caption>Contact List</caption>
        <thead>
            <tr>
                <th colspan="1">Name</th>
                <th colspan="1">Phone number</th>
                <th colspan="1">Email</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>John</td>
                <td>1234567890</td>
                <td>john@example.com</td>
            </tr>
            <tr>
                <td>Jane</td>
                <td>1234567890</td>
                <td>jane@example.com</td>
            </tr>
            <tr>
                <td>Jim</td>
                <td>1234567890</td>
                <td>jim@example.com</td>
            </tr>
            <tr>
                <td>Jill</td>
                <td>1234567890</td>
                <td>jill@example.com</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
