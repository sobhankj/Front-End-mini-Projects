<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>session 12 lists</title>
</head>
<body>
    <h1>Shopping List</h1>
    <!-- unordered list -->
    <!-- defualt unordered list -->
    <ul>
        <li>Milk</li>
        <li>Bread</li>
        <li>Eggs</li>
        <li>Bread</li>
    </ul>
    <ul type="square">
        <li>Milk</li>
        <li>Bread</li>
        <li>Eggs</li>
        <li>Bread</li>
    </ul>
    <ul type="circle">
        <li>Milk</li>
        <li>Bread</li>
        <li>Eggs</li>
        <li>Bread</li>
    </ul>
    <ul type="none">
        <li>Milk</li>
        <li>Bread</li>
        <li>Eggs</li>
        <li>Bread</li>
    </ul>

    <!-- ordered list -->
    <!-- defualt ordered list -->
    <ol>
        <li>Milk</li>
        <li>Bread</li>
        <li>Eggs</li>
        <li>Bread</li>
    </ol>
    <ol type="A">
        <li>Milk</li>
        <li>Bread</li>
        <li>Eggs</li>
        <li>Bread</li>
    </ol>
    <ol type="a">
        <li>Milk</li>
        <li>Bread</li>
        <li>Eggs</li>
        <li>Bread</li>
    </ol>
</body>
</html>
