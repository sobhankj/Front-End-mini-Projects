<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>session 16 forms part 2</title>
</head>
<body>
    <form action="" method="get" autocomplete="on" target="_blank">
        <fieldset>
            <legend>User Registration</legend>
            <label for="name">Name:</label>
            <input type="text" id="name" name="fname">
        </fieldset>
        <br>
        <fieldset>
            <legend>Radio Button</legend>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
        </fieldset>
        <br>
        <fieldset>
            <legend>Check Box</legend>
            <input type="checkbox" id="html" name="skills1" value="html">
            <label for="html">HTML</label>
            <input type="checkbox" id="css" name="skills2" value="css">
            <label for="css">CSS</label>
            <input type="checkbox" id="javascript" name="skills3" value="javascript">
            <label for="javascript">JavaScript</label>
        </fieldset>
        <br>
        <fieldset>
            <legend>Submit Button</legend>
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </fieldset>
        <br>
        <fieldset>
            <legend>Select Box</legend>
            <select name="country" id="country">
                <option value="india">India</option>
                <option value="usa">USA</option>
                <option value="uk">UK</option>
                <option value="canada">Canada</option>
                <option value="australia">Australia</option>
            </select>
        </fieldset>
        <br>
        <fieldset>
            <legend>Text Area</legend>
            <textarea name="message" id="message" cols="30" rows="5"></textarea>
        </fieldset>
        <br>
        <fieldset>
            <legend>Data list</legend>
            <input type="text" id="fruit" name="fruit" list="fruits">
            <datalist id="fruits">
                <option>Apple</option>
                <option>Banana</option>
                <option>Orange</option>
                <option>Pineapple</option>
            </datalist>
        </fieldset>
        <fieldset>
            <legend>color input</legend>
            <input type="color" id="color" name="color">
        </fieldset>
        <fieldset>
            <legend>time input</legend>
            <input type="time" id="time" name="time">
        </fieldset>
        <fieldset>
            <legend>date input</legend>
            <input type="date" id="date" name="date">
        </fieldset>
        <fieldset>
            <legend>email input</legend>
            <input type="email" id="email" name="email">
        </fieldset>
        <fieldset>
            <legend>number input</legend>
            <input type="number" id="number" name="number">
        </fieldset>
        <fieldset>
            <legend>password input</legend>
            <input type="password" id="password" name="password">
        </fieldset>
        <fieldset>
            <legend>file input</legend>
            <input type="file" id="file" name="file">
        </fieldset>
        <fieldset>
            <legend>range input</legend>
            <input type="range" id="range" name="range">
        </fieldset>
    </form>
</body>
</html>
