<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random User Generator</title>
    <link rel="stylesheet" href="./styles/app.css">
    <script src="./scripts/script.js" defer></script>
</head>
<body>
    <div class="profileContainer">
        <div class="header">
            <img src="" alt="" width="200px" class="profilePicture">
            <h1 class="name"></h1>
            <a href="#" class="username"></a>
        </div>
        <div class="content">
            <label for="email">Email</label>
            <input type="email" id="email" readonly class="input">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" readonly class="input">
            <label for="birthday">Birthday</label>
            <input type="text" id="birthday" readonly class="input">
            <label for="age">Age</label>
            <input type="text" id="age" readonly class="input">
        </div>
        <button class="generateButton">Generate New User</button>
    </div>
</body>
</html>
